<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>UAE Content AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b1020;color:#f5f7ff}.container{max-width:900px;margin:auto;padding:24px 16px 50px}.hero{text-align:center;padding:28px 8px 18px}.badge{display:inline-block;padding:7px 12px;border:1px solid #33406b;border-radius:999px;color:#aebcff;font-size:13px}h1{font-size:42px;margin:16px 0 8px}.hero p{color:#aab2c8;font-size:17px;margin:0}.card{background:#121a2d;border:1px solid #263352;border-radius:18px;padding:20px;margin-top:18px;box-shadow:0 12px 35px rgba(0,0,0,.2)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;color:#aeb8d0;margin-bottom:7px}select,input,button{width:100%;border-radius:12px;padding:13px 14px;font-size:15px}select,input{background:#0c1324;color:#fff;border:1px solid #33405e}button{border:0;background:#6d5dfc;color:white;font-weight:700;cursor:pointer;margin-top:18px}button:disabled{opacity:.65;cursor:wait}.result{white-space:pre-wrap;line-height:1.65;color:#e9edff}.hidden{display:none}.small{font-size:12px;color:#8791aa;text-align:center;margin-top:14px}.error{color:#ffb4b4;background:#3a1820;border:1px solid #74313d;padding:12px;border-radius:12px;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:34px}}</style></head><body><div class="container"><section class="hero"><span class="badge">🇦🇪 Built for UAE creators & small businesses</span><h1>UAE Content AI</h1><p>Generate TikTok, Reels and Shorts content in seconds.</p></section><section class="card"><div class="grid"><div><label>Business type</label><select id="business"><option>Restaurant</option><option>Barber</option><option>Gym</option><option>Car Wash</option><option>Real Estate</option><option>Online Shop</option><option>Other</option></select></div><div><label>Platform</label><select id="platform"><option>TikTok</option><option>Instagram Reels</option><option>YouTube Shorts</option></select></div><div><label>Language</label><select id="language"><option>English</option><option>Arabic</option></select></div><div><label>Content type</label><select id="type"><option>Video Idea</option><option>Hook</option><option>30-Second Script</option><option>Caption</option><option>Hashtags</option><option>7-Day Content Plan</option></select></div></div><div style="margin-top:14px"><label>Optional topic / offer</label><input id="topic" placeholder="e.g. Friday biryani offer, new haircut, gym membership"></div><button id="generateBtn" onclick="generate()">✨ Generate Content</button><div id="error" class="error hidden"></div></section><section class="card hidden" id="outputCard"><h2>✨ Your content</h2><div class="result" id="output"></div><button onclick="copyText()">📋 Copy</button></section><p class="small">UAE Content AI • Cloudflare Pages + OpenAI</p></div><script>async function generate(){const b=document.getElementById("generateBtn"),e=document.getElementById("error"),c=document.getElementById("outputCard"),o=document.getElementById("output");e.classList.add("hidden");b.disabled=true;b.textContent="⏳ Generating...";try{const p={business:document.getElementById("business").value,platform:document.getElementById("platform").value,language:document.getElementById("language").value,type:document.getElementById("type").value,topic:document.getElementById("topic").value.trim()};const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});const d=await r.json();if(!r.ok)throw new Error(d.error||"Generation failed.");o.textContent=d.output+"\n\nPlatform: "+p.platform;c.classList.remove("hidden");c.scrollIntoView({behavior:"smooth"})}catch(x){e.textContent="⚠️ "+(x.message||"Something went wrong.");e.classList.remove("hidden")}finally{b.disabled=false;b.textContent="✨ Generate Content"}}function copyText(){navigator.clipboard.writeText(document.getElementById("output").textContent).then(()=>alert("Copied!"))}</script></body></html>
